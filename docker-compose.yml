services:
  backend:
    build: { context: ., dockerfile: Dockerfile.backend }
    env_file: [.env.example]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u;u.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 5
  frontend:
    build: { context: ., dockerfile: Dockerfile.frontend }
    ports: ["8080:80"]
    depends_on: [backend]
